<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Page using layout</title>

    <style>
      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f7fa;
      }

      header {
        background-color: navy;
        color: white;
        padding: 25px;
        text-align: center;
      }

      header h1 {
        margin: 0;
      }

      nav {
        background-color: #333;
        color: white;
        padding: 15px;
        text-align: center;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin: 20px;
      }

      .content {
        display: flex;
        min-height: calc(100vh - 175px);
      }

      aside {
        width: 220px;
        background-color: #e8f1f5;
        padding: 20px;
      }

      main {
        flex: 1;
        padding: 30px;
        box-sizing: border-box;
        background-color: white;
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: 400px;
        border: none;
      }

      footer {
        background-color: black;
        color: white;
        padding: 20px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Karnataka Travel Website</h1>
    </header>

    <nav>
      <a href="home-menu.html" target="sideBar"> Home </a>

      <a href="Bangalore-menu.html" target="sideBar"> Bangalore </a>

      <a href="Mysore-menu.html" target="sideBar"> Mysore </a>

      <a href="Malnad-menu.html" target="sideBar"> Malnad </a>
    </nav>

    <div class="content">
      <aside>
        <iframe src="home-menu.html" name="sideBar"> </iframe>
      </aside>

      <main>
        <iframe src="welcome.html" name="courseContent"> </iframe>
      </main>
    </div>

    <footer>Copyright © 2026</footer>
  </body>
</html>
