 <!-- PARAGRAPH & TEXT TAGS -->

    <i>Italic text</i><br>
    <em>Emphasized text</em><br>

    <u>Underlined text</u><br>
    <mark>Highlighted text</mark><br>

    <small>Small text</small><br>

    <del>Deleted text</del><br>
    <ins>Inserted text</ins><br>

    H<sub>2</sub>O<br>
    X<sup>2</sup><br>

    <p>
        This is <span>span text</span> inside a paragraph.
    </p>

    <p>Hello<br>World</p>
