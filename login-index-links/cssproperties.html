<!doctype html>
<html>
  <head>
    <title>CSS Properties Demo</title>

    <style>
      /* =========================
           TEXT PROPERTIES
           ========================= */

      h1 {
        color: darkblue;
        text-align: center;
        text-decoration: underline;
        text-transform: uppercase;
      }

      p {
        color: darkgreen;
        text-align: justify;
        text-decoration: none;
        text-transform: capitalize;
      }

      /* =========================
           FONT PROPERTIES
           ========================= */

      .description {
        font-size: 18px;
        font-family: Arial, sans-serif;
        font-weight: normal;
        font-style: italic;
      }

      .highlight {
        font-size: 22px;
        font-family: Georgia, serif;
        font-weight: bold;
        font-style: normal;
      }

      /* =========================
           BACKGROUND
           ========================= */

      .course-box {
        background-color: lightyellow;

        /* =========================
               BORDER
               ========================= */

        border: 2px double orange;
        border-radius: 15px;

        /* =========================
               SPACING
               ========================= */

        margin: 20px;
        padding: 20px;
      }

      /* Another example for button */

      .register-button {
        background-color: green;
        color: white;

        border: 2px solid darkgreen;
        border-radius: 8px;

        padding: 10px 25px;
        margin: 10px;

        font-size: 16px;
        font-family: Arial, sans-serif;
        font-weight: bold;
        font-style: normal;

        text-align: center;
        text-decoration: none;
        text-transform: uppercase;
      }
    </style>
  </head>

  <body>
    <h1>Java Full Stack Training</h1>

    <div class="course-box">
      <p class="description">
        This course teaches students the fundamentals of Java, Spring Boot,
        database programming and web development.
      </p>

      <p class="highlight">Course Duration: 6 Months</p>

      <p class="highlight">Course Mode: Classroom Training</p>

      <button class="register-button">Register Now</button>
    </div>
  </body>
</html>
