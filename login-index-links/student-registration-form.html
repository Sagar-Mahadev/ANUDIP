<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>    
</head>
<body>


<!-- Logout Button -->
<div align="right">
    <a href="login.html">
        <button type="button">Logout</button>
    </a>
</div>

<form action="" method="post">

    <!-- Personal Information -->
    <fieldset>
        <legend>Personal Information</legend><br>

        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" name="studentId" value="STU1001" readonly><br><br>

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name"
               minlength="3" maxlength="50" required autofocus><br><br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required><br><br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" maxlength="20" required><br><br>

        <label for="age">Age</label>
        <input type="number" id="age" name="age" min="18" max="60" required><br><br>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required><br><br>

        <label>Gender</label>
        <div class="radio-group">
            <label><input type="radio" name="gender" value="male" required> Male</label>
            <label><input type="radio" name="gender" value="female"> Female</label>
            <label><input type="radio" name="gender" value="other"> Other</label>
        </div><br>
    </fieldset>

    <!-- Academic Information -->
    <fieldset>
        <legend>Academic Information</legend><br>

        <label for="course">Course</label>
        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="BE">BE</option>
            <option value="BTech">B.Tech</option>
            <option value="MCA">MCA</option>
            <option value="MTech">M.Tech</option>
        </select><br><br>

        <label for="percentage">Percentage</label>
        <input type="number" id="percentage" name="percentage" min="0" max="100" step="0.01" required><br><br>

        <label>Technical Skills</label>
        <div class="checkbox-group">
            <label><input type="checkbox" name="skills" value="java"> Java</label>
            <label><input type="checkbox" name="skills" value="python"> Python</label>
            <label><input type="checkbox" name="skills" value="javascript"> JavaScript</label>
            <label><input type="checkbox" name="skills" value="sql"> SQL</label>
        </div><br><br>

        <label for="resume">Upload Resume</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx"><br>
    </fieldset>

    <!-- Address Information -->
    <fieldset>
        <legend>Address Information</legend><br>

        <label for="address">Address</label>
        <textarea id="address" name="address" rows="5" maxlength="300"
                  placeholder="Enter your complete address" required></textarea><br><br>

        <label for="city">City</label>
        <select id="city" name="city" required>
            <option value="">-- Select City --</option>
            <option value="mysore">Mysore</option>
            <option value="mandya">Mandya</option>
            <option value="bangalore">Bangalore</option>
            <option value="mangalore">Mangalore</option>
        </select><br>
    </fieldset>

    <!-- Terms -->
    <fieldset>
        <legend>Terms and Conditions</legend><br>
        <label>
            <input type="checkbox" name="terms" value="accepted" required>
            I agree to the terms and conditions.
        </label><br>
    </fieldset><br>

    <!-- Buttons -->
    <button type="submit">Register</button>
    <button type="reset">Reset</button>

</form>

</body>
</html>
