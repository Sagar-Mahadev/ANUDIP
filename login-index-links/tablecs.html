<!doctype html>
<html>
  <head>
    <title>Student Marks Report</title>

    <style>
      table {
        border-collapse: collapse;
        width: 600px;
      }

      th,
      td {
        border: 1px solid red;
        padding: 10px;
        text-align: center;
      }

      caption {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      thead {
        background-color: lightblue;
      }

      tfoot {
        background-color: lightgreen;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <table>
      <caption>
        Student Marks Report
      </caption>

      <thead>
        <tr>
          <th>Student Name</th>
          <th>English</th>
          <th>Maths</th>
          <th>Science</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Sagar</td>
          <td>85</td>
          <td>90</td>
          <td>88</td>
        </tr>

        <tr>
          <td>Gowtham</td>
          <td>78</td>
          <td>85</td>
          <td>82</td>
        </tr>

        <tr>
          <td>Hitesh</td>
          <td>92</td>
          <td>95</td>
          <td>90</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <th colspan="4">Overall Student Marks Report</th>
        </tr>
      </tfoot>
    </table>
    <br />
    <br />

    <a href="start.html">Back to start</a> <br />
  </body>
</html>
